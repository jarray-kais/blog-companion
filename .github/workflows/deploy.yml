# .github/workflows/deploy.yml
# Pipeline CI/CD pour le projet blog-companion
# Objectif : 
# - Vérifier le code (lint + build) sur chaque push et PR
# - Déployer les Edge Functions Supabase uniquement sur push vers main
# - Le frontend est déployé automatiquement par Netlify (connexion directe à la branche main)

name: Deploy to Production

# Déclencheurs du workflow
on:
  push:
    branches:
      - main            # À chaque push sur main
  pull_request:
    branches:
      - main            # À chaque pull request vers main

# Variable globale pour la version de Node.js
env:
  NODE_VERSION: '20'

jobs:
  # ===================================================================
  # Job 1 : Tests, lint et build du projet
  # ===================================================================
  # Ce job s'exécute à chaque push et à chaque PR
  build-and-test:
    name: Build et Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js (version ${{ env.NODE_VERSION }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'                  # Met en cache les dépendances npm pour accélérer les runs suivants

      - name: Installer les dépendances
        run: npm ci                     # Installation propre et reproductible

      - name: Exécuter le linter
        run: npm run lint
        continue-on-error: true         # Ne bloque pas le pipeline si le linter trouve des warnings/erreurs

      - name: Construire le projet (build Vite)
        run: npm run build
        env:
          # Injection des variables d'environnement nécessaires pour le build Vite
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ===================================================================
  # Job 3 : Notification de succès
  # ===================================================================
  # Affiche un message clair dans les logs une fois tout réussi
  notify-success:
    name: Notification de succès
    runs-on: ubuntu-latest
    needs: [build-and-test]   # Attend le job de build
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Afficher le message de succès
        run: |
          echo "🎉 CI Passée !"
          echo "✔️ Tests, lint et build OK"
          echo "✔️ Le déploiement est géré automatiquement par Netlify (Git Push)"