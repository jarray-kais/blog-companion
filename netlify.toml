# Netlify Configuration - Serverless Functions v2
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
